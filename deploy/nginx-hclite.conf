server {
    listen 80;
    listen [::]:80;
    server_name a.private.meikaai.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a.private.meikaai.cn;

    ssl_certificate /etc/letsencrypt/live/a.private.meikaai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a.private.meikaai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/hclite-proxy.conf;
    }
}
